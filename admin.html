<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Syndicate — Admin</title>
    <style>
      :root {
        --matrix-green: #39ff14;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0a0a0f;
        color: #d7ffd0;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      body {
        display: flex;
        justify-content: center;
        padding: 40px 16px;
        box-sizing: border-box;
      }
      #panel {
        width: min(480px, 100%);
      }
      h1 {
        margin: 0 0 20px;
        color: var(--matrix-green);
        font-size: 1.2rem;
        letter-spacing: 2px;
        text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
      }
      section {
        margin-bottom: 24px;
        padding: 18px;
        border: 1px solid rgba(183, 255, 171, 0.55);
        border-radius: 6px;
        background: rgba(8, 16, 12, 0.72);
      }
      section[hidden] { display: none; }
      label { display: block; font-size: 11px; letter-spacing: 1px; margin-bottom: 6px; }
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid rgba(183, 255, 171, 0.55);
        border-radius: 4px;
        background: rgba(4, 8, 6, 0.85);
        color: #efffec;
        font: inherit;
        font-size: 13px;
      }
      button {
        margin-top: 12px;
        padding: 10px 14px;
        border: 1px solid var(--matrix-green);
        border-radius: 4px;
        background: rgba(35, 103, 43, 0.9);
        color: #efffec;
        font: 700 12px/1 inherit;
        letter-spacing: 1px;
        cursor: pointer;
      }
      button.secondary {
        background: none;
        border-color: rgba(183, 255, 171, 0.55);
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      #login-error { min-height: 1.2em; color: #ff6b6b; font-size: 11.5px; margin-top: 8px; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .row + .row { margin-top: 16px; }
      a.button-link {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 14px;
        border: 1px solid var(--matrix-green);
        border-radius: 4px;
        background: rgba(35, 103, 43, 0.9);
        color: #efffec;
        font: 700 12px/1 inherit;
        letter-spacing: 1px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>AGENT SYNDICATE // ADMIN</h1>

      <section id="login-section">
        <form id="login-form" novalidate>
          <label for="login-password">Admin password</label>
          <input id="login-password" type="password" name="password" autocomplete="current-password" required />
          <div id="login-error" role="alert" aria-live="assertive"></div>
          <button id="login-submit" type="submit">LOG IN</button>
        </form>
      </section>

      <section id="dashboard-section" hidden>
        <div class="row">
          <label for="gate-toggle" style="margin: 0;">Email gate required to play</label>
          <input id="gate-toggle" type="checkbox" />
        </div>
        <div id="gate-error" role="alert" aria-live="assertive"></div>

        <div class="row">
          <a id="download-link" class="button-link" href="/api/admin/emails.csv" download>DOWNLOAD EMAILS (CSV)</a>
          <button id="logout-button" class="secondary" type="button">LOG OUT</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
